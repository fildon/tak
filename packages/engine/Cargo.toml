[package]
name = "tak-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys      = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.release]
opt-level = 3
lto       = true

# wasm-pack 0.10 ships an outdated wasm-opt that chokes on multi-table Wasm
# output from Rust ≥ 1.82.  The release profile already does LTO + opt-level 3
# so we get good code size without wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
