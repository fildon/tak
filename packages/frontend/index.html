<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tak</title>

    <!-- Restore the path encoded by public/404.html on GitHub Pages (spa-github-pages). -->
    <!-- This is a no-op on Netlify and in local dev where the query param is absent.  -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            decoded[0] + (decoded[1] ? '&' + decoded[1] : '') + l.hash,
          );
        }
      })(window.location);
    </script>
    <meta
      name="description"
      content="Play Tak — the elegant two-player strategy game of roads and stones — in your browser. No install required."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rupertmckay.com/tak/" />
    <meta property="og:title" content="Tak — a game of roads and strategy" />
    <meta
      property="og:description"
      content="Play Tak in your browser. No install required. Two players, one road, pure strategy."
    />
    <meta property="og:image" content="https://rupertmckay.com/tak/preview.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tak — a game of roads and strategy" />
    <meta
      name="twitter:description"
      content="Play Tak in your browser. No install required. Two players, one road, pure strategy."
    />
    <meta name="twitter:image" content="https://rupertmckay.com/tak/preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
